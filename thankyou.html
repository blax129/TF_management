<!DOCTYPE html>
<html lang="en" class="home-root">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("ppm-theme");
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    html.home-root { background-color: #08090B; }
    html.home-root[data-theme="light"] { background-color: #FAFAFB; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Payment verification received for TenantFirst Management private rental application review.">
  <title>Verification Received | TenantFirst Management</title>
  <link rel="icon" href="image/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="image/logo.png" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="image/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TenantFirst Management">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="TenantFirst Management">
  <meta property="og:description" content="Professional private property management services for rental listings, tenant support, applications, and property assistance.">
  <meta property="og:url" content="https://privatepropmanagement.com/">
  <meta property="og:image" content="https://privatepropmanagement.com/og-private-property-management-v3.jpg">
  <meta property="og:image:secure_url" content="https://privatepropmanagement.com/og-private-property-management-v3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="TenantFirst Management">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TenantFirst Management">
  <meta name="twitter:description" content="Professional private property management services for rental listings, tenant support, applications, and property assistance.">
  <meta name="twitter:image" content="https://privatepropmanagement.com/og-private-property-management-v3.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="image/home-mark-on-dark.svg" as="image" type="image/svg+xml">
  <link rel="preload" href="image/home-mark-on-light.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="page-loader.css">
  <link rel="stylesheet" href="home-design.css">
</head>
<body class="simple-flow-page">
  <div class="ppm-page-loader" id="ppmPageLoader" role="status" aria-live="polite" aria-label="Loading" hidden>
    <div class="ppm-page-loader__content">
      <img class="ppm-page-loader__mark home-mark home-mark--on-dark" src="image/home-mark-on-dark.svg" alt="TenantFirst Management" width="76" height="76">
      <img class="ppm-page-loader__mark home-mark home-mark--on-light" src="image/home-mark-on-light.svg" alt="" width="76" height="76">
      <span class="ppm-page-loader__spinner" aria-hidden="true"></span>
    </div>
  </div>
  <script>document.getElementById("ppmPageLoader").hidden = false;</script>
  <script src="page-loader.js"></script>
  <script src="theme.js"></script>

  <header class="site-header back-nav">
    <div class="container header-inner">
      <a href="index.html" class="back-button" id="thankyouBackButton" aria-label="Back to home">
        <span class="back-button-icon" aria-hidden="true">←</span>
        <span>Back</span>
      </a>
    </div>
  </header>

  <main class="payment-confirmation-section">
    <div class="container narrow">
      <div class="success-message">
        <div class="success-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 4 12 14.01 7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Verification Received</h1>
        <p>Your confirmation has been received and is currently under review. It will be matched with your Application ID, and you will be contacted if any additional information is needed.</p>
        <div class="submit-section">
          <a class="button button-primary submit-button" id="returnHomeLink" href="index.html">Return Home</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const language = (params.get('lang') ||
        window.sessionStorage.getItem('latestApplicationLanguage') ||
        window.localStorage.getItem('latestApplicationLanguage') ||
        window.localStorage.getItem('site-language') ||
        document.documentElement.lang ||
        'en').toLowerCase().split('-')[0];
      const supportedLanguage = ['en', 'es', 'zh', 'fr', 'ar'].includes(language) ? language : 'en';
      const returnHomeLink = document.getElementById('returnHomeLink');
      const homeTargets = {
        en: 'index.html',
        es: 'index.html?lang=es',
        zh: 'index.html?lang=zh',
        fr: 'index.html?lang=fr',
        ar: 'index.html?lang=ar'
      };

      window.sessionStorage.setItem('latestApplicationLanguage', supportedLanguage);
      window.localStorage.setItem('latestApplicationLanguage', supportedLanguage);
      window.localStorage.setItem('site-language', supportedLanguage);

      const homeHref = homeTargets[supportedLanguage] || homeTargets.en;
      if (returnHomeLink) {
        returnHomeLink.href = homeHref;
      }
      const thankyouBackButton = document.getElementById('thankyouBackButton');
      if (thankyouBackButton) {
        thankyouBackButton.href = homeHref;
      }

      function loadEmailJsSdk() {
        return new Promise((resolve, reject) => {
          if (window.emailjs) {
            resolve(window.emailjs);
            return;
          }

          const existingScript = document.querySelector('script[src*="@emailjs/browser"]');
          if (existingScript) {
            existingScript.addEventListener('load', () => resolve(window.emailjs), { once: true });
            existingScript.addEventListener('error', reject, { once: true });
            return;
          }

          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
          script.async = true;
          script.onload = () => resolve(window.emailjs);
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      async function sendPendingPaymentUploadNotification() {
        const pendingNotification = window.sessionStorage.getItem('pendingPaymentUploadNotification');
        if (!pendingNotification) {
          return;
        }

        let payload;
        try {
          payload = JSON.parse(pendingNotification);
        } catch (error) {
          console.error('Payment screenshot EmailJS notification payload error:', error);
          window.sessionStorage.removeItem('pendingPaymentUploadNotification');
          return;
        }

        try {
          const emailjs = await loadEmailJsSdk();
          emailjs.init({ publicKey: 'o_-KMgXx6jQOU0Ez1' });

          const supportEmail = 'katherineriordanppm@gmail.com';
          const emailResult = await emailjs.send('service_tb3npxh', 'template_c5bnbd8', {
            to_email: supportEmail,
            recipient_email: supportEmail,
            support_email: supportEmail,
            subject: 'New Payment Screenshot Uploaded',
            cloudinary_url: payload.cloudinaryUrl,
            image_url: payload.cloudinaryUrl,
            payment_screenshot_url: payload.cloudinaryUrl,
            upload_timestamp: payload.uploadTimestamp,
            current_language: payload.currentLanguage || supportedLanguage,
            language: payload.currentLanguage || supportedLanguage,
            application_id: payload.applicationId || 'Not provided',
            applicant_name: payload.applicantName || 'Not provided',
            applicant_email: payload.applicantEmail || 'Not provided',
            applicant_phone: payload.applicantPhone || 'Not provided',
            property: payload.property || 'Not provided',
            property_information: payload.property || 'Not provided',
            payment_method: payload.paymentMethod || 'Not specified',
            public_id: payload.publicId || 'Not provided',
            message: [
              'New Payment Screenshot Uploaded',
              `Cloudinary image URL: ${payload.cloudinaryUrl}`,
              `Upload timestamp: ${payload.uploadTimestamp}`,
              `Current language: ${payload.currentLanguage || supportedLanguage}`,
              `Application ID: ${payload.applicationId || 'Not provided'}`,
              `Applicant: ${payload.applicantName || 'Not provided'}`,
              `Applicant email: ${payload.applicantEmail || 'Not provided'}`,
              `Applicant phone: ${payload.applicantPhone || 'Not provided'}`,
              `Property: ${payload.property || 'Not provided'}`
            ].join('\n')
          });

          console.log('Payment screenshot EmailJS notification sent successfully:', emailResult);
          window.sessionStorage.removeItem('pendingPaymentUploadNotification');
        } catch (error) {
          console.error('Payment screenshot EmailJS notification failed:', error);
        }
      }

      sendPendingPaymentUploadNotification();
    })();
  </script>
  <script src="i18n-extensions.js"></script>
  <script src="i18n-apply-form.js"></script>
  <script src="script.js"></script>
</body>
</html>
